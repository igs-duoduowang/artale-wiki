name: 發布資料站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得網站檔案
        uses: actions/checkout@v4
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上傳靜態網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v4
